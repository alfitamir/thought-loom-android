<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="أفكاري">
  <title>أفكاري — Thought Loom</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7DC9A"/>
      <stop offset="0.45" stop-color="#E9C979"/>
      <stop offset="0.75" stop-color="#C4A66E"/>
      <stop offset="1" stop-color="#A38954"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#1F243D"/>
  <g transform="translate(256 256) scale(0.795) translate(-256 -256)">
    <!-- sound arcs -->
    <path d="M137.1,186.1 A136,136 0 0 0 137.1,317.9" fill="none" stroke="url(#gold)" stroke-width="6.5" stroke-linecap="round" opacity="0.95"/>
    <path d="M374.9,186.1 A136,136 0 0 1 374.9,317.9" fill="none" stroke="url(#gold)" stroke-width="6.5" stroke-linecap="round" opacity="0.95"/>
    <path d="M107.3,169.6 A170,170 0 0 0 107.3,334.4" fill="none" stroke="url(#gold)" stroke-width="6.5" stroke-linecap="round" opacity="0.72"/>
    <path d="M404.7,169.6 A170,170 0 0 1 404.7,334.4" fill="none" stroke="url(#gold)" stroke-width="6.5" stroke-linecap="round" opacity="0.72"/>
    <path d="M77.6,153.1 A204,204 0 0 0 77.6,350.9" fill="none" stroke="url(#gold)" stroke-width="6.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M434.4,153.1 A204,204 0 0 1 434.4,350.9" fill="none" stroke="url(#gold)" stroke-width="6.5" stroke-linecap="round" opacity="0.5"/>
    <!-- capsule -->
    <rect x="170" y="84" width="172" height="259" rx="86" fill="#1B2038" stroke="url(#gold)" stroke-width="11"/>
    <!-- T : two rectangles, no text element -->
    <rect x="201" y="148" width="110" height="27" fill="#FFF5EC"/>
    <rect x="243" y="148" width="26" height="130" fill="#FFF5EC"/>
    <!-- cradle -->
    <path d="M140,238 L140,292 A116,82 0 0 0 372,292 L372,238" fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round"/>
    <!-- stem + base -->
    <rect x="245" y="370" width="22" height="60" fill="url(#gold)"/>
    <rect x="187" y="428" width="138" height="22" rx="9" fill="url(#gold)"/>
  </g>
</svg>
